<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer votre mot de passe</title>

<link rel="stylesheet" href="create-password.css">

</head>

<body>

<div class="card">

<h1>Créer votre mot de passe</h1>

<p class="subtitle">

Votre identité a été confirmée.

Choisissez maintenant un mot de passe sécurisé.

</p>

<div class="field">

<label>Nouveau mot de passe</label>

<input
type="password"
id="password"
placeholder="••••••••">

</div>

<div class="field">

<label>Confirmer le mot de passe</label>

<input
type="password"
id="confirmPassword"
placeholder="••••••••">

</div>

<button id="createBtn">

Créer mon compte

</button>

<p id="message"></p>

</div>

<script type="module" src="create-password.js"></script>

</body>

</html>
