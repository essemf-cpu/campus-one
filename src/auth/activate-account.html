<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus One | Activer mon compte</title>

    <link rel="stylesheet" href="activate-account.css">

</head>

<body>

<main class="container">

    <div class="card">

        <h1>Activer mon compte</h1>

        <p>

            Entrez votre numéro de carte afin de vérifier
            votre identité.

        </p>

        <form id="activationForm">

            <input
                type="text"
                id="matricule"
                placeholder="Numéro de carte"
                required>

            <button type="submit">

                Continuer

            </button>

        </form>

        <p id="message"></p>

    </div>

</main>

<script type="module"
        src="activate-account.js"></script>

</body>

</html>
