<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Notifications — Campus One</title>

    <link
        rel="stylesheet"
        href="./notifications.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="notifications-page">

    <!-- HEADER -->

    <section class="notifications-header">

        <div>

            <p>
                Centre de notifications
            </p>

            <h1>
                Notifications 🔔
            </h1>

        </div>

        <div class="header-notification-icon">

            <i class="fa-solid fa-bell"></i>

        </div>

    </section>


    <!-- RECHERCHE -->

    <section class="modern-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="notification-search"
            placeholder="Rechercher une notification...">

    </section>


    <!-- FILTRES -->

    <section class="notification-filters">

        <button
            class="category-pill active-pill">

            Tout

        </button>

        <button
            class="category-pill">

            Amis

        </button>

        <button
            class="category-pill">

            Campus

        </button>

        <button
            class="category-pill">

            Restaurant

        </button>

        <button
            class="category-pill">

            Maintenance

        </button>

        <button
            class="category-pill">

            Annonces

        </button>

    </section>


    <!-- LISTE -->

<section
    id="notifications-list"
    class="notifications-list">

    <div class="notifications-loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <span>Chargement...</span>
    </div>

</section>

</div>


<!-- NAVBAR -->

<nav class="ios-navbar">

    <a
        href="../../../dashboards/etudiant/dashboard.html">

        <i class="fa-solid fa-house"></i>

    </a>


    <a
        href="./index.html"
        class="nav-bell active">

        <i class="fa-solid fa-bell"></i>

        <div
            id="notification-badge"
            class="notification-badge">

        </div>

    </a>


    <!-- Profil sera branché quand la page existera -->

    <a
        href="#"
        class="nav-avatar-link">

        <div class="nav-avatar-placeholder">

            <i class="fa-solid fa-user"></i>

        </div>

    </a>

</nav>


<script type="module">

    import {
        afficherNotifications,
        afficherBadgeNotifications
    }
    from "./notifications.js";

    afficherNotifications();

    afficherBadgeNotifications();

</script>

</body>

</html>
