<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historique des demandes</title>

    <link rel="stylesheet" href="../components/sidebar.css">
    <link rel="stylesheet" href="historique-demandes.css">

</head>

<body>

    <div id="app-loader">

        <img src="/src/assets/logo coud.png" alt="Campus One">

        <h2>Campus One</h2>

        <p>Chargement de votre espace...</p>

    </div>

    <div id="sidebar-container"></div>

    <main id="content">

        <section class="page-title">

            <h1>Historique des demandes - <span id="page-title"></span></h1>

        </section>

        <section class="card">

            <div class="card-header">

                <h2>Historique des demandes étudiantes</h2>

            </div>

            <table class="table">

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Nom</th>

                        <th>Chambre</th>

                        <th>Niveau</th>

                        <th>Type</th>

                        <th>Description</th>

                        <th>Statut</th>

                        <th>Cause</th>

                        <th>Évaluation</th>

                        <th>Commentaire</th>

                    </tr>

                </thead>

                <tbody id="historique-body">

                    <tr class="empty-row">

                        <td colspan="10">

                            Aucun historique disponible.

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script type="module" src="historique-demandes.js"></script>

</body>

</html>
