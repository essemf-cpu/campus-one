<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choix du mode de confirmation</title>
  <script type="module" crossorigin src="/assets/auth/activation-method-M0zWBILm.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/assets/authService-BFXktNCZ.js">
  <link rel="stylesheet" crossorigin href="/assets/activation-method-DRVl5jm6.css">
</head>

<body>

<div class="card">

    <h1>Choisissez où recevoir votre code</h1>

    <p class="subtitle">
        Un code de vérification vous sera envoyé afin de confirmer votre identité.
    </p>

    <label class="option">

        <div class="left">

            <input
                type="radio"
                name="mode"
                value="email"
                checked>

            <div>

                <h3>📧 E-mail</h3>

                <span id="email"></span>

            </div>

        </div>

    </label>

    <label class="option">

        <div class="left">

            <input
                type="radio"
                name="mode"
                value="phone">

            <div>

                <h3>📱 Téléphone</h3>

                <span id="phone"></span>

            </div>

        </div>

    </label>

    <button id="continueBtn">
        Continuer
    </button>

</div>


</body>
</html>
