<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus One | Connexion</title>

    <link rel="stylesheet"
               href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script type="module" crossorigin src="/assets/auth/login-tZqZac2h.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/assets/authService-DX3gg-GL.js">
  <link rel="modulepreload" crossorigin href="/assets/sessionManager-DuiOh9M5.js">
  <link rel="stylesheet" crossorigin href="/assets/login-LMmec5Uj.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                <img src="/assets/logo%20coud-BWhvgonx.png" alt="Logo COUD">
                <h1>Campus One</h1>
                <p>Système d'information du COUD</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="identifiant">Identifiant</label>

                    <input
                        type="text"
                        id="identifiant"
                        placeholder="Numéro carte"
                        required>
                </div>

                <div class="input-group">

    <label for="password">
        Mot de passe
    </label>

    <div class="password-container">

        <input
            type="password"
            id="password"
            placeholder="********"
            required>

        <i
        id="togglePassword"
        class="fa-regular fa-eye toggle-password">
        </i>

    </div>

<div class="input-group" id="annee-group">

    <label for="anneeAcademique">
        Année académique
    </label>

    <select
        id="anneeAcademique"
        name="anneeAcademique"
        required>

        <option value="">
            Chargement...
        </option>

    </select>

</div>

</div>

                <button type="submit" id="btnLogin">
                    Se connecter
                </button>

                <a href="forgot-password.html" class="forgot">
                    Mot de passe oublié ?
                </a>

                <p id="message"></p>

            </form>

        </div>

    </main>


</body>

</html>
